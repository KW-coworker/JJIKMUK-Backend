name: Backend Initial DB Preparation
run-name: Initial DB preparation at ${{ inputs.expected_sha }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 검토한 main 전체 커밋
        type: string
        required: true
      request_id:
        description: 새 작업 식별자 32자리
        type: string
        required: true
      confirm:
        description: 서비스 동결·백업·FULLTEXT 보존 정비·원본 V17~V20·기존 서비스 복귀 승인
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: backend-production-deployment
  cancel-in-progress: false
  queue: max

jobs:
  prepare-schema:
    if: github.ref == 'refs/heads/main' && inputs.confirm
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      OPERATIONS_REQUEST_ID: ${{ inputs.request_id }}
      OPERATIONS_CONFIRM: ${{ inputs.confirm }}
      CD_ENABLED: ${{ vars.BACKEND_CD_ENABLED }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: 고정 SDK 및 최초 실행 조건 검사
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r ops/operations/requirements.lock
          PYTHONPATH=ops/operations:ops/cd python3 -B -c 'from initial_db_runner import validate_context; validate_context()'
          PYTHONPATH=ops/operations:ops/cd python3 -B -m unittest discover -s ops/operations/tests -p test_initial_schema.py -v
      - name: main 원본 테스트와 실행 파일 빌드
        run: ./gradlew test bootJar
      - name: 최초 역할 발급 시작 시각 기록
        run: python3 -c 'import os,time; open(os.environ["GITHUB_ENV"],"a").write("INITIAL_ROLE_REQUEST_EPOCH="+str(int(time.time()))+"\n")'
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::076767081522:role/JjikmukOperationsExecute
          aws-region: ap-northeast-2
          allowed-account-ids: '076767081522'
          role-duration-seconds: 3600
          role-session-name: initial-db-${{ github.run_id }}
          retry-max-attempts: 1
      - name: 공간 감시·서비스 동결·백업 후 원본 정비와 보존 검증
        run: python3 -B ops/operations/initial_db_runner.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: initial-db-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: operation-results/
          if-no-files-found: ignore
          retention-days: 14
