name: Backend CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Install locked SDK for offline request validation
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r ops/cd/requirements-sdk.lock
      - name: Validate deployment gates and recovery
        run: PYTHONPATH=ops/cd python3 -m unittest discover -s ops/cd/tests -v
      - name: Test and build backend
        run: ./gradlew test bootJar
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7
