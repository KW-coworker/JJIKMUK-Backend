name: Server Operations Checks
on:
  pull_request:
    branches: [main]
# A required check must run for every main PR, including application/docs-only changes.
permissions:
  contents: read
jobs:
  operations-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r ops/operations/requirements-private.lock
      - name: Require native Go regex validation
        run: go version
      - run: PYTHONPATH=ops/operations:ops/cd python3 -B -m unittest discover -s ops/operations/tests -v
      - run: PYTHONPATH=ops/chatbot:ops/cd python3 -B -m unittest discover -s ops/chatbot/tests -v
