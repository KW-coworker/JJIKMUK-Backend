name: Server Operations Checks
on:
  pull_request:
    branches: [main]
    paths: ['ops/operations/**', '.github/workflows/server-operations*.yml']
permissions:
  contents: read
jobs:
  operations-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: PYTHONPATH=ops/operations python3 -B -m unittest discover -s ops/operations/tests -v
