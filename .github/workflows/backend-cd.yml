name: Backend CD
run-name: Backend CD ${{ inputs.expected_sha || github.sha }}${{ inputs.maintenance_id && format(' [resume:{0}]', inputs.maintenance_id) || '' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      maintenance_id:
        description: Verified maintenance ID; empty means tests/build only
        type: string
      expected_sha:
        description: Exact current main for a verified maintenance resume
        type: string

permissions:
  contents: read

concurrency:
  group: backend-production-deployment
  cancel-in-progress: false
  queue: max

env:
  CD_ENABLED: ${{ vars.BACKEND_CD_ENABLED }}
  AWS_EC2_METADATA_DISABLED: 'true'
  MAINTENANCE_ID: ${{ inputs.maintenance_id }}
  EXPECTED_SHA: ${{ inputs.expected_sha }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject an obsolete main before the full build
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=ops/cd python3 -B -c 'from auto_context import guard; guard(deployment=False)'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Install locked SDK for offline request validation
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r ops/cd/requirements-sdk.lock
      - name: Validate deployment logic
        run: PYTHONPATH=ops/cd python3 -m unittest discover -s ops/cd/tests -v
      - name: Test and build the exact main commit
        run: ./gradlew test bootJar
      - name: Package immutable release
        if: (github.event_name == 'push' || inputs.maintenance_id != '') && vars.BACKEND_CD_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ops/cd/release.py package
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: (github.event_name == 'push' || inputs.maintenance_id != '') && vars.BACKEND_CD_ENABLED == 'true'
        with:
          name: backend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/cd-release/
          if-no-files-found: error
          retention-days: 14
      - name: Explain build-only result
        if: (github.event_name != 'push' && inputs.maintenance_id == '') || vars.BACKEND_CD_ENABLED != 'true'
        run: echo 'Tests and build only. No server deployment. Initial activation is still required.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: backend-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.maintenance_id != '') && vars.BACKEND_CD_ENABLED == 'true'
    environment: backend-production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: backend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Install locked AWS SDK
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r ops/cd/requirements-sdk.lock
      - name: Obtain automatic-backend-only temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::076767081522:role/JjikmukBackendAutoDeploy
          aws-region: ap-northeast-2
          allowed-account-ids: '076767081522'
          role-duration-seconds: 3600
          role-session-name: backend-cd-${{ github.run_id }}
          retry-max-attempts: 1
      - name: Verify backup, publish, dispatch once and wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ops/cd/release.py dispatch
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: deployment-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-results/
          if-no-files-found: ignore
          retention-days: 14
