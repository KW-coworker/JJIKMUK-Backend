spring.datasource.url=jdbc:h2:mem:jjikmuk-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.schema-locations=classpath:classification-memberships.sql
spring.jpa.show-sql=false
spring.flyway.enabled=false
product.import.enabled=false
product.import.rollback.enabled=false
recommendation.import.enabled=false
recommendation.logging.enabled=false
recommendation.evaluation.enabled=false
product.search.mode=locate
product.search.backfill.enabled=false
product.search.logging.enabled=false
product.search.evaluation.enabled=false
product.grouping.mode=legacy
product.data-model.backfill.enabled=false
