spring.application.name=backend
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Product.csv is kept outside the built JAR because the source file is about 891 MB.
# Override PRODUCT_DATA_RESOURCE with a file: URI in deployed environments.
product.import.enabled=${PRODUCT_IMPORT_ENABLED:false}
product.import.resource=${PRODUCT_DATA_RESOURCE:file:src/main/resources/data/Product.csv}
product.import.version=V5.1-PRODUCTCSV-CLASSIFICATION-INDEX
product.import.batch-size=500
product.import.expected-rows=1348436
product.import.validation.max-empty-rows=${PRODUCT_IMPORT_MAX_EMPTY_ROWS:0}
product.import.validation.max-duplicate-barcodes=${PRODUCT_IMPORT_MAX_DUPLICATE_BARCODES:20}
product.import.validation.minimum-named-ratio=${PRODUCT_IMPORT_MINIMUM_NAMED_RATIO:0.99}
product.import.rollback.enabled=${PRODUCT_IMPORT_ROLLBACK_ENABLED:false}

# Keep LOCATE until search_keywords is backfilled and the ngram FULLTEXT index is built.
product.search.mode=${PRODUCT_SEARCH_MODE:locate}
product.search.keyword-version=${PRODUCT_SEARCH_KEYWORD_VERSION:v1}
product.search.backfill.enabled=${PRODUCT_SEARCH_BACKFILL_ENABLED:false}
product.search.backfill.batch-size=${PRODUCT_SEARCH_BACKFILL_BATCH_SIZE:3000}
product.search.backfill.delay-ms=${PRODUCT_SEARCH_BACKFILL_DELAY_MS:100}
product.search.backfill.rebuild-all=${PRODUCT_SEARCH_BACKFILL_REBUILD_ALL:false}
product.search.backfill.allow-when-indexed=${PRODUCT_SEARCH_BACKFILL_ALLOW_WHEN_INDEXED:false}
product.search.logging.enabled=${PRODUCT_SEARCH_LOGGING_ENABLED:true}
product.search.logging.store-query-text=${PRODUCT_SEARCH_LOGGING_STORE_QUERY_TEXT:true}
product.search.logging.store-user-id=${PRODUCT_SEARCH_LOGGING_STORE_USER_ID:false}
product.search.evaluation.enabled=${PRODUCT_SEARCH_EVALUATION_ENABLED:false}
product.search.evaluation.warmup-runs=${PRODUCT_SEARCH_EVALUATION_WARMUP_RUNS:1}
product.search.evaluation.measurement-runs=${PRODUCT_SEARCH_EVALUATION_MEASUREMENT_RUNS:3}
product.search.evaluation.minimum-hit-rate=${PRODUCT_SEARCH_EVALUATION_MINIMUM_HIT_RATE:0.8}
product.search.evaluation.minimum-mrr=${PRODUCT_SEARCH_EVALUATION_MINIMUM_MRR:0.5}
product.search.evaluation.minimum-pair-overlap=${PRODUCT_SEARCH_EVALUATION_MINIMUM_PAIR_OVERLAP:0.8}
product.search.evaluation.maximum-p95-ms=${PRODUCT_SEARCH_EVALUATION_MAXIMUM_P95_MS:1000}

# Product.csv import fills every product_group_key and deployment DBs include
# idx_products_product_group_key. Override to legacy only while upgrading an old DB.
product.grouping.mode=${PRODUCT_GROUPING_MODE:key}
product.data-model.backfill.enabled=${PRODUCT_DATA_MODEL_BACKFILL_ENABLED:false}
product.data-model.backfill.batch-size=${PRODUCT_DATA_MODEL_BACKFILL_BATCH_SIZE:1000}
product.data-model.backfill.delay-ms=${PRODUCT_DATA_MODEL_BACKFILL_DELAY_MS:100}

# ProductNeighbors.csv contains precomputed product-to-product candidates.
# The importer validates the whole file first and uses a staging-table swap on MySQL.
recommendation.import.enabled=${RECOMMENDATION_IMPORT_ENABLED:false}
recommendation.import.resource=${RECOMMENDATION_DATA_RESOURCE:file:src/main/resources/data/ProductNeighbors.csv}
recommendation.import.version=V1.0-CONTENT-NEIGHBORS
recommendation.import.batch-size=500
recommendation.import.expected-rows=233658

# Runtime recommendation policy. Missing preference signals automatically
# renormalize the remaining weights instead of treating preference as zero.
recommendation.ranking.similarity-weight=${RECOMMENDATION_SIMILARITY_WEIGHT:0.70}
recommendation.ranking.preference-weight=${RECOMMENDATION_PREFERENCE_WEIGHT:0.25}
recommendation.ranking.data-quality-weight=${RECOMMENDATION_DATA_QUALITY_WEIGHT:0.05}
recommendation.ranking.mmr-relevance=${RECOMMENDATION_MMR_RELEVANCE:0.85}
recommendation.logging.enabled=${RECOMMENDATION_LOGGING_ENABLED:true}
recommendation.logging.store-user-id=${RECOMMENDATION_LOGGING_STORE_USER_ID:false}
recommendation.evaluation.enabled=${RECOMMENDATION_EVALUATION_ENABLED:false}
recommendation.evaluation.dataset-version=${RECOMMENDATION_EVALUATION_DATASET_VERSION:reviewed-v1}
recommendation.evaluation.limit=${RECOMMENDATION_EVALUATION_LIMIT:10}
recommendation.evaluation.min-similarity-score=${RECOMMENDATION_EVALUATION_MIN_SCORE:0.2}
recommendation.evaluation.minimum-hit-rate=${RECOMMENDATION_EVALUATION_MINIMUM_HIT_RATE:0.30}
recommendation.evaluation.minimum-ndcg=${RECOMMENDATION_EVALUATION_MINIMUM_NDCG:0.15}
recommendation.evaluation.maximum-verification-required-rate=${RECOMMENDATION_EVALUATION_MAXIMUM_VERIFICATION_REQUIRED_RATE:1.0}
recommendation.evaluation.maximum-empty-response-rate=${RECOMMENDATION_EVALUATION_MAXIMUM_EMPTY_RESPONSE_RATE:0.0}
recommendation.evaluation.maximum-p95-ms=${RECOMMENDATION_EVALUATION_MAXIMUM_P95_MS:1000}

jwt.secret=${JWT_SECRET}
jwt.expiration-time=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
